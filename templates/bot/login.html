{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <title>MT5 Secure Login</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        * { box-sizing: border-box; font-family: "Segoe UI", Arial, sans-serif; }
        body {
            margin: 0;
            background: radial-gradient(circle at top, #0f172a, #020617);
            color: #e5e7eb;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-wrapper { width: 100%; max-width: 420px; padding: 20px; }
        .login-card {
            background: #020617;
            border-radius: 14px;
            padding: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7), inset 0 0 0 1px rgba(255,255,255,0.05);
        }
        .logo { text-align: center; margin-bottom: 25px; }
        .logo h1 { margin: 0; font-size: 22px; font-weight: 700; color: #22c55e; }
        .logo p { margin-top: 6px; font-size: 13px; color: #94a3b8; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 13px; margin-bottom: 6px; color: #cbd5f5; }
        input {
            width: 100%; padding: 12px 14px;
            border-radius: 8px; border: 1px solid #1e293b;
            background: #020617; color: #fff; outline: none; font-size: 14px;
            transition: 0.2s;
        }
        input:focus { border-color: #22c55e; box-shadow: 0 0 0 1px #22c55e33; }
        button {
            width: 100%; margin-top: 16px; padding: 13px;
            border-radius: 10px; border: none;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #052e16; font-size: 15px; font-weight: 700; cursor: pointer;
            transition: 0.25s;
        }
        button:hover { filter: brightness(1.1); }
        button:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; }
        .msg { margin-top: 18px; text-align: center; font-size: 13px; min-height: 18px; }
        .footer { margin-top: 18px; text-align: center; font-size: 11px; color: #64748b; }
        .spinner {
            display: inline-block; width: 14px; height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid #22c55e; border-radius: 50%;
            animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">

        <div class="logo">
            <h1>Forex Trading Bot</h1>
            <p>Connect your MT5 trading account</p>
        </div>

        <div class="form-group">
            <label>MT5 Login ID</label>
            <input type="number" id="login" placeholder="e.g. 12345678" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter MT5 password" required>
        </div>

        <div class="form-group">
            <label>Server</label>
            <input type="text" id="server" placeholder="Exness-MT5Real" required>
        </div>

        <button onclick="connect()" id="btn">
            Connect Account
        </button>
        <div id="tradeMsg" class="trade-msg"></div>


        <div class="msg" id="msg"></div>

        <div class="footer">
            Algo Trading must be enabled in MT5
        </div>
    </div>
</div>


<script src="{% static 'bot/js/login.js' %}"></script>

</body>
</html>
