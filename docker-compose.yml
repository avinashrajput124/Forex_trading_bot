version: "3.9"

services:
  web:
    build: .
    container_name: django_app
    volumes:
      - .:/app
    expose:
      - "8000"
    depends_on:
      - redis

  redis:
    image: redis:7
    container_name: redis

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./staticfiles:/app/staticfiles
    depends_on:
      - web
    restart: always